<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#100E0C">
<title>Front Row</title>
<style>
:root{
  color-scheme:dark;
  --pit:#100E0C;      /* auditorium black, warmed */
  --stage:#1A1714;    /* tile surface */
  --riser:#241F1B;    /* raised */
  --rail:#3A332C;     /* hairlines */
  --house:#F5EFE6;    /* primary ink */
  --dim:#8D8478;      /* quiet ink */
  --shell:1200px;    /* one measure shared by the bar and the grid */
  --pad:clamp(14px, 2.4vw, 32px);
  --gap:clamp(18px, 2.4vw, 32px);
  --sans:-apple-system, "Segoe UI Variable Display", "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
/* An author display rule beats the UA stylesheet's [hidden] rule, and .ctl
   sets display:flex - without this the hidden button shows anyway. */
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  background:var(--pit);
  color:var(--house);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.4;
  -webkit-tap-highlight-color:transparent;
}

/* ---- Chrome: a quiet name, and the two controls ------------------------ */
.bar{
  position:sticky;
  top:0;
  z-index:3;
  display:flex;align-items:center;gap:10px;
  width:100%;
  max-width:var(--shell);
  margin-inline:auto;
  padding:clamp(12px,1.8vh,20px) var(--pad);
  background:var(--pit);
}
/* The bar is capped to --shell, so on a wider window the grid would scroll
   past it through the gutters. This covers the full width behind it. */
.bar::before{
  content:"";
  position:absolute;
  inset:0 calc((100vw - 100%) / -2);
  background:var(--pit);
  z-index:-1;
}
.brand{
  margin-inline-end:auto;
  min-width:0;
  font-size:12px;font-weight:700;
  letter-spacing:.24em;text-indent:.24em;text-transform:uppercase;
  color:var(--dim);
  user-select:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ctl{
  display:flex;align-items:center;
  min-height:48px;
  padding:0 16px;
  border:1px solid var(--rail);border-radius:11px;
  background:transparent;
  color:var(--dim);
  font-family:inherit;font-size:14px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;
  touch-action:manipulation;
  transition:color .12s ease, border-color .12s ease, background .12s ease;
}
.ctl:hover{color:var(--house);background:var(--riser)}
.ctl:focus-visible{outline:3px solid var(--house);outline-offset:2px}
.region{position:relative;display:flex}
.region select{
  appearance:none;-webkit-appearance:none;
  padding:0 34px 0 16px;
  font-size:15px;
  line-height:1;
}
.region option{background:var(--stage);color:var(--house);text-transform:none;letter-spacing:normal}
/* Chevron as a clip-path so the page still makes no network requests. */
.region::after{
  content:"";
  position:absolute;right:15px;top:50%;
  width:11px;height:7px;
  transform:translateY(-50%);
  background:var(--dim);
  clip-path:polygon(0 0, 100% 0, 50% 100%);
  pointer-events:none;
}
#edit[aria-pressed="true"]{
  background:var(--house);border-color:var(--house);color:var(--pit);
}

/* ---- The channels ------------------------------------------------------ */
.deck{
  flex:1;
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
  /* Cards this size overflow a car screen, so the grid starts at the top and
     scrolls rather than centring and clipping its first row. */
  align-content:start;
  gap:var(--gap);
  width:100%;
  max-width:var(--shell);
  margin-inline:auto;
  padding:0 var(--pad) clamp(16px,3vh,36px);
  padding-block-start:clamp(4px,1vh,12px);
}
.tile{
  --tint:var(--house);
  position:relative;
  display:flex;align-items:center;justify-content:center;
  flex-wrap:wrap;gap:10px;
  padding:14px;
  aspect-ratio:3/2;
  border:1px solid var(--rail);
  border-radius:18px;
  background:var(--stage);
  color:var(--house);
  text-decoration:none;
  overflow:hidden;
  touch-action:manipulation;
  transition:background .12s ease, border-color .12s ease, transform .08s ease, opacity .12s ease;
}
.tile::after{
  content:"";
  position:absolute;inset:-40% -30% auto -30%;height:170%;
  background:radial-gradient(52% 52% at 50% 42%, var(--glow, var(--tint)) 0%, transparent 72%);
  opacity:.16;
  pointer-events:none;
}
.tile:hover{background:var(--riser);border-color:var(--tint)}
.tile:active{transform:scale(.985)}
.tile:focus-visible{outline:3px solid var(--house);outline-offset:3px}
.lockup .glyph{height:clamp(34px, 4.4vw, 60px)}
.glyph{
  height:clamp(44px, 6vw, 84px);
  width:auto;
  fill:var(--tint);
  display:block;
}
.logo{max-width:70%;max-height:clamp(44px,6vw,84px);object-fit:contain;display:block}
/* Fallback only - used where no mark is available for the channel. */
.wordmark{
  font-size:clamp(17px, 2vw, 26px);
  font-weight:600;
  letter-spacing:.01em;
  text-align:center;
  text-wrap:balance;
  line-height:1.2;
  color:var(--house);
}

/* ---- Edit mode --------------------------------------------------------- */
.deck.editing .tile{
  cursor:grab;
  touch-action:none;
  /* the slide-aside when a card opens a gap */
  transition:transform .18s ease, opacity .12s ease, border-color .12s ease;
}
/* The dragged card leaves the grid entirely and follows the pointer, so the
   slot below is the only thing holding a place in the layout. */
.tile.dragging{
  position:fixed;
  margin:0;
  cursor:grabbing;
  opacity:.96;
  pointer-events:none;          /* so elementFromPoint sees what is underneath */
  z-index:5;
  transition:none;
  box-shadow:0 18px 44px rgba(0,0,0,.6);
  border-color:var(--tint);
}
/* Where it will land. */
.slot{
  aspect-ratio:3/2;
  border:2px dashed var(--rail);
  border-radius:18px;
  background:rgba(245,239,230,.03);
  transition:transform .18s ease;
}
.deck.editing .tile.off{
  opacity:.34;
  border-style:dashed;
}
.deck.editing .tile.off::after{opacity:.04}
.badge{
  position:absolute;top:8px;right:8px;
  width:30px;height:30px;
  display:none;align-items:center;justify-content:center;
  border-radius:50%;
  background:var(--house);color:var(--pit);
  font-size:16px;font-weight:800;line-height:1;
}
.deck.editing .badge{display:flex}
.tile.off .badge{background:var(--riser);color:var(--dim)}

.empty{
  grid-column:1/-1;
  text-align:center;
  color:var(--dim);
  font-size:14px;
  padding:40px 0;
}

/* Flatten the tiles on a short landscape window so a long market still fits. */
@media (min-width:641px) and (max-height:520px){
  .tile,.slot{aspect-ratio:2/1}
}
@media (max-width:640px){
  .deck{grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));align-content:start}
  .brand{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
}
</style>
</head>
<body>

<div class="bar">
  <span class="brand">Front Row</span>
  <span class="region">
    <select id="region" class="ctl" aria-label="Country"></select>
  </span>
  <button type="button" id="edit" class="ctl" aria-pressed="false">Edit</button>
</div>

<nav class="deck" id="deck" aria-label="Channels"></nav>

<script>
(function () {
  "use strict";

  var YT_REDIRECT = "https://www.youtube.com/redirect?q=";
  var STORE_MARKET = "frontrow.market";
  var STORE_HIDDEN = "frontrow.hidden";
  var STORE_BOOT = "frontrow.boot";
  var STORE_SEEN = "frontrow.seen";
  var STORE_ORDER = "frontrow.order";
  var LONG_PRESS_MS = 450;
  var DRAG_SLOP = 8;

  // Point this at a folder of your own SVGs to override the built-in marks.
  // Each tile loads "<LOGO_DIR>/<channel id>.svg" and keeps what it already
  // has if that file is missing. Empty means no image requests at all.
  var LOGO_DIR = "";

  var DATA = JSON.parse(document.getElementById("data").textContent);
  var SERVICES = DATA.s;
  var MARKETS = DATA.m;
  var ALIASES = { gb: "uk", "en-gb": "uk", "en-us": "us" };
  var DEFAULT_CODE = "uk";

  var deck = document.getElementById("deck");
  var select = document.getElementById("region");
  var editBtn = document.getElementById("edit");

  // Storage can be unavailable (private mode, blocked site data) and throws on
  // access in some contexts, so every touch is guarded and the app still runs.
  function load(key, fallback) {
    try {
      var raw = window.localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* nothing to do */ }
  }

  // Whether storage actually works here decides how the first-visit rule below
  // behaves; without it we cannot tell a first visit from a hundredth.
  function storageWorks() {
    try {
      window.localStorage.setItem("frontrow.probe", "1");
      window.localStorage.removeItem("frontrow.probe");
      return true;
    } catch (e) { return false; }
  }

  function findMarket(raw) {
    if (!raw) return null;
    var key = String(raw).trim().toLowerCase();
    key = ALIASES[key] || key;
    for (var i = 0; i < MARKETS.length; i++) {
      if (MARKETS[i].c === key) return MARKETS[i];
    }
    return null;
  }

  var params = new URLSearchParams(window.location.search);
  // A ?c= in the URL wins for this visit, otherwise the last choice is restored.
  var market = findMarket(params.get("c") || params.get("country"))
            || findMarket(load(STORE_MARKET, null))
            || findMarket(DEFAULT_CODE);
  // fs controls two separate things, so it has three settings:
  //   (absent)  bootstrap the launcher, then link channels directly. The
  //             full-screen view survives a same-window navigation, so one
  //             interstitial per session covers every channel.
  //   all       also route each channel through YouTube - a per-channel
  //             interstitial, for a firmware where the view does not persist
  //   0 / off   neither
  // "once" is the old name for the default and still works, so bookmarks
  // written before it became the default keep behaving.
  var fsMode = (params.get("fs") || "").toLowerCase();
  if (fsMode === "off") fsMode = "0";
  if (fsMode === "on") fsMode = "all";
  if (fsMode !== "0" && fsMode !== "all") fsMode = "once";
  var bootstraps = fsMode !== "0";
  var wrapChannels = fsMode === "all";
  // Hidden channels are kept per market: switching country reveals that
  // market's own full list, and switching back restores its filtering.
  var hidden = load(STORE_HIDDEN, {});
  if (!hidden || typeof hidden !== "object") hidden = {};
  // Channel order, per market, same as hidden. Anything not in the stored list
  // falls to the end, so channels added in a later release still appear.
  var order = load(STORE_ORDER, {});
  if (!order || typeof order !== "object") order = {};
  var editing = false;

  function hiddenFor(code) {
    var list = hidden[code];
    return Object.prototype.toString.call(list) === "[object Array]" ? list : [];
  }
  function isHidden(id) { return hiddenFor(market.c).indexOf(id) !== -1; }

  function toggle(id) {
    var list = hiddenFor(market.c).slice();
    var at = list.indexOf(id);
    if (at === -1) { list.push(id); } else { list.splice(at, 1); }
    hidden[market.c] = list;
    save(STORE_HIDDEN, hidden);
  }

  function orderedChannels() {
    var saved = order[market.c];
    if (Object.prototype.toString.call(saved) !== "[object Array]") return market.ch.slice();
    var out = [];
    saved.forEach(function (id) {
      if (market.ch.indexOf(id) !== -1 && out.indexOf(id) === -1) out.push(id);
    });
    market.ch.forEach(function (id) { if (out.indexOf(id) === -1) out.push(id); });
    return out;
  }

  // Only ever called from a drag, which only happens in edit mode - where every
  // channel is on screen, so this captures the full list rather than dropping
  // the hidden ones.
  function saveOrder() {
    var ids = [], nodes = deck.querySelectorAll(".tile");
    for (var i = 0; i < nodes.length; i++) ids.push(nodes[i].getAttribute("data-channel"));
    order[market.c] = ids;
    save(STORE_ORDER, order);
  }

  function urlFor(svc) {
    return typeof svc.u === "string" ? svc.u : svc.u[market.c];
  }

  function buildTile(id) {
    var svc = SERVICES[id];
    var url = urlFor(svc);
    if (!url) return null;

    var off = isHidden(id);
    var a = document.createElement("a");
    a.className = "tile" + (off ? " off" : "");
    a.setAttribute("data-channel", id);
    if (svc.t) a.style.setProperty("--tint", svc.t);
    if (svc.g) a.style.setProperty("--glow", svc.g);
    if (editing) {
      a.setAttribute("role", "button");
      a.setAttribute("tabindex", "0");
      a.setAttribute("aria-pressed", String(!off));
    } else {
      a.href = (wrapChannels && !svc.native) ? YT_REDIRECT + encodeURIComponent(url) : url;
    }

    if (svc.p || svc.b) {
      var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "glyph");
      svg.setAttribute("viewBox", svc.vb || "0 0 24 24");
      svg.setAttribute("aria-hidden", "true");
      svg.setAttribute("focusable", "false");
      if (svc.b) {
        svg.innerHTML = svc.b;      // mark built from more than one shape
      } else {
        var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", svc.p);
        svg.appendChild(path);
      }
      a.appendChild(svg);
      a.setAttribute("aria-label", svc.n);
      if (!svc.w) {
        a.className += " lockup";
        var label = document.createElement("span");
        label.className = "wordmark";
        label.textContent = svc.n;
        a.appendChild(label);
      }
    } else {
      // No mark for this channel, so the name carries the tile.
      var span = document.createElement("span");
      span.className = "wordmark";
      span.textContent = svc.n;
      a.appendChild(span);
    }

    var badge = document.createElement("span");
    badge.className = "badge";
    badge.setAttribute("aria-hidden", "true");
    badge.textContent = off ? "+" : "✓";
    a.appendChild(badge);

    return a;
  }

  function mountLogo(tile, id) {
    var img = document.createElement("img");
    img.className = "logo";
    img.alt = "";
    img.decoding = "async";
    img.addEventListener("load", function () {
      // A lockup holds both a mark and a label; a supplied logo replaces the
      // whole thing, so hide every one of them, not just the first.
      var existing = tile.querySelectorAll(".glyph, .wordmark");
      for (var i = 0; i < existing.length; i++) existing[i].hidden = true;
    });
    img.addEventListener("error", function () { img.remove(); });
    img.src = LOGO_DIR.replace(/\/+$/, "") + "/" + id + ".svg";
    tile.insertBefore(img, tile.firstChild);
  }

  function render() {
    select.value = market.c;
    editBtn.textContent = editing ? "Done" : "Edit";
    editBtn.setAttribute("aria-pressed", String(editing));
    deck.className = "deck" + (editing ? " editing" : "");
    deck.textContent = "";

    var shown = 0;
    orderedChannels().forEach(function (id) {
      if (!editing && isHidden(id)) return;
      var tile = buildTile(id);
      if (!tile) return;
      deck.appendChild(tile);
      if (LOGO_DIR) mountLogo(tile, id);
      shown++;
    });

    if (!shown) {
      var p = document.createElement("p");
      p.className = "empty";
      p.textContent = "No channels shown. Tap Edit to bring some back.";
      deck.appendChild(p);
    }
  }

  // A refresh is not a fresh arrival. Because boot=1 is stripped from the
  // address bar on arrival, a reload would otherwise look identical to a cold
  // open and bounce again. Going back should not re-bounce either.
  function isRevisit() {
    try {
      var entries = window.performance && window.performance.getEntriesByType
        ? window.performance.getEntriesByType("navigation") : null;
      if (entries && entries.length && entries[0].type) {
        return entries[0].type === "reload" || entries[0].type === "back_forward";
      }
      // Deprecated, but it is what older engines have.
      var nav = window.performance && window.performance.navigation;
      if (nav) return nav.type === 1 || nav.type === 2;
    } catch (e) { /* fall through */ }
    return false;
  }

  // Bootstrap the launcher itself into the full-screen view: bounce once
  // through the YouTube redirect back to this same page, marked so the
  // return trip does not bounce again.
  //
  // Two independent guards, because an unguarded version of this is a
  // redirect loop in a moving car:
  //   1. the "boot" parameter carried through the redirect, and
  //   2. a timestamp, in case anything strips that parameter.
  // Either one alone stops the loop; both have to fail to get a cycle.
  function bootstrapFullScreen() {
    if (window.top !== window.self) return false;  // framed: never bootstrap out
    if (isRevisit()) return false;                 // a refresh or a back nav
    if (params.has("stay")) {                      // "let me bookmark this"
      save(STORE_SEEN, true);
      return false;
    }

    // Do not bounce on the very first visit. The bounce lands the page inside
    // the YouTube app's full-screen view, which has no bookmark control, so
    // without this there is no moment at which the launcher can be saved to
    // favourites. One clean pass in the normal browser is enough to do it.
    // Skipped when storage is unavailable, since then every visit looks like
    // the first and the launcher would never bootstrap at all.
    if (storageWorks() && !load(STORE_SEEN, false)) {
      save(STORE_SEEN, true);
      return false;
    }
    if (!bootstraps) return false;                 // ?fs=0 opts out entirely
    if (params.get("boot") === "1") return false;  // this is the return trip
    var last = Number(load(STORE_BOOT, 0)) || 0;
    if (Date.now() - last < 30000) return false;   // just tried; do not retry
    save(STORE_BOOT, Date.now());

    var here = new URL(window.location.href);
    here.searchParams.set("boot", "1");
    window.location.replace(YT_REDIRECT + encodeURIComponent(here.toString()));
    return true;
  }

  function syncUrl() {
    // Sandboxed frames and some file:// contexts refuse replaceState. The
    // choice is already saved and applied, so this is not worth throwing over.
    try {
      var next = new URL(window.location.href);
      next.searchParams.delete("boot");
      next.searchParams.delete("stay");
      next.searchParams.set("c", market.c);
      if (fsMode === "once") { next.searchParams.delete("fs"); } else { next.searchParams.set("fs", fsMode); }
      window.history.replaceState(null, "", next.toString());
    } catch (e) { /* keep the rendered links, drop the URL sync */ }
  }

  MARKETS.forEach(function (m) {
    var o = document.createElement("option");
    o.value = m.c;
    o.textContent = m.f + " " + m.n;
    select.appendChild(o);
  });

  select.addEventListener("change", function () {
    market = findMarket(select.value) || market;
    save(STORE_MARKET, market.c);
    syncUrl();
    render();
  });

  editBtn.addEventListener("click", function () {
    editing = !editing;
    render();
  });

  function tileFrom(node) {
    // Not every engine puts closest() on SVG elements, so walk up by hand.
    while (node && node !== deck) {
      if (node.classList && node.classList.contains("tile")) return node;
      node = node.parentNode;
    }
    return null;
  }

  function tileUnder(x, y, exclude) {
    var t = tileFrom(document.elementFromPoint(x, y));
    return (t && t !== exclude) ? t : null;
  }

  // press tracks one pointer from down to up. It decides between three
  // outcomes: a tap (toggle, or follow the link), a long press (enter edit
  // mode), and a drag (reorder). Movement past DRAG_SLOP rules out the tap.
  var press = null;
  var swallowClick = false;

  // Reordering: the dragged card leaves the grid and follows the pointer, a
  // dashed slot holds the place it will land in, and the rest slide aside to
  // open that gap. Grid reflow is not animatable, so the sliding is done by
  // FLIP - snap each card back to where it was, then release it.
  var drag = null;

  function flip(exclude, mutate) {
    var nodes = [].slice.call(deck.children);
    var before = nodes.map(function (n) { return n.getBoundingClientRect(); });
    mutate();
    nodes.forEach(function (n, i) {
      if (n === exclude) return;
      var after = n.getBoundingClientRect();
      var dx = before[i].left - after.left, dy = before[i].top - after.top;
      if (!dx && !dy) return;
      n.style.transition = "none";
      n.style.transform = "translate(" + dx + "px," + dy + "px)";
      n.getBoundingClientRect();        // flush, so clearing below animates
      n.style.transition = "";
      n.style.transform = "";
    });
  }

  function startDrag(ev, tile) {
    var box = tile.getBoundingClientRect();
    var slot = document.createElement("div");
    slot.className = "slot";
    deck.insertBefore(slot, tile);
    tile.classList.add("dragging");
    tile.style.width = box.width + "px";
    tile.style.height = box.height + "px";
    tile.style.left = box.left + "px";
    tile.style.top = box.top + "px";
    drag = { tile: tile, slot: slot, dx: ev.clientX - box.left, dy: ev.clientY - box.top };
    try { tile.setPointerCapture(ev.pointerId); } catch (e) { /* fine */ }
  }

  function moveDrag(ev) {
    drag.tile.style.left = (ev.clientX - drag.dx) + "px";
    drag.tile.style.top = (ev.clientY - drag.dy) + "px";
    var over = tileUnder(ev.clientX, ev.clientY, drag.tile);
    if (!over || over === drag.slot) return;
    var box = over.getBoundingClientRect();
    var ref = (ev.clientX - box.left) > box.width / 2 ? over.nextSibling : over;
    if (ref === drag.slot) return;      // already where it would go
    flip(drag.tile, function () { deck.insertBefore(drag.slot, ref); });
  }

  function finishDrag() {
    var d = drag;
    drag = null;
    d.tile.classList.remove("dragging");
    d.tile.style.width = "";
    d.tile.style.height = "";
    d.tile.style.left = "";
    d.tile.style.top = "";
    flip(d.tile, function () {
      deck.insertBefore(d.tile, d.slot);
      deck.removeChild(d.slot);
    });
    saveOrder();
  }

  function endPress(ev) {
    if (!press) return;
    if (press.timer) { window.clearTimeout(press.timer); }
    if (press.dragging) {
      try { press.tile.releasePointerCapture(press.id); } catch (e) { /* fine */ }
      finishDrag();
      swallowClick = true;   // a drop is not a tap
    }
    press = null;
  }

  deck.addEventListener("pointerdown", function (ev) {
    if (ev.button && ev.button !== 0) return;
    // A drag does not always emit a trailing click, so a suppression set by
    // the last gesture can survive to eat the next real tap. Each new gesture
    // starts clean.
    swallowClick = false;
    var tile = tileFrom(ev.target);
    if (!tile) return;
    press = { tile: tile, x: ev.clientX, y: ev.clientY, id: ev.pointerId,
              dragging: false, moved: false, timer: 0 };
    if (editing) return;      // already there; movement will start a drag
    press.timer = window.setTimeout(function () {
      if (!press || press.moved) return;
      press.timer = 0;
      editing = true;
      swallowClick = true;    // the click that follows is not a toggle
      render();               // rebuilds the deck, so the held tile is gone
      press = null;
    }, LONG_PRESS_MS);
  });

  deck.addEventListener("pointermove", function (ev) {
    if (!press) return;
    if (!press.moved &&
        (Math.abs(ev.clientX - press.x) > DRAG_SLOP ||
         Math.abs(ev.clientY - press.y) > DRAG_SLOP)) {
      press.moved = true;
      if (press.timer) { window.clearTimeout(press.timer); press.timer = 0; }
      if (editing) {
        press.dragging = true;
        startDrag(ev, press.tile);
      }
    }
    if (!press.dragging) return;
    ev.preventDefault();
    moveDrag(ev);
  });

  deck.addEventListener("pointerup", endPress);
  deck.addEventListener("pointercancel", endPress);
  // A long press on a link otherwise raises the browser's own menu.
  deck.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });

  function handleToggle(ev) {
    if (swallowClick) { swallowClick = false; ev.preventDefault(); return; }
    if (!editing) return;
    var tile = tileFrom(ev.target);
    if (!tile) return;
    ev.preventDefault();
    toggle(tile.getAttribute("data-channel"));
    render();
  }

  deck.addEventListener("click", handleToggle);
  deck.addEventListener("keydown", function (ev) {
    if (!editing) return;
    if (ev.key !== "Enter" && ev.key !== " " && ev.key !== "Spacebar") return;
    handleToggle(ev);
  });

  save(STORE_MARKET, market.c);

  bootstrapFullScreen();

  syncUrl();
  render();
})();
</script>
</body>
</html>
